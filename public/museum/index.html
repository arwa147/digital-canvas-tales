<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Digital Museum — The Museum of Visual Stories</title>
  <meta name="description" content="The Digital Museum — where every image holds a story. Explore paintings, history, places, emotions and ideas." />
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <button id="langToggle" class="lang-btn" type="button">العربية</button>
    <div class="header-inner">
      <p class="museum-mark" aria-hidden="true">✦ ✦ ✦</p>
      <h1 class="site-title" data-i18n="title">The Digital Museum</h1>
      <p class="site-subtitle" data-i18n="tagline">The Museum of Visual Stories</p>
      <p class="site-motto" data-i18n="motto">Where every image holds a story.</p>
    </div>
  </header>

  <main class="museum-main">
    <p class="intro" data-i18n="intro">Choose an image to read its story.</p>
    <nav class="filters" id="filters" aria-label="Categories"></nav>
    <section class="gallery" id="gallery"></section>
  </main>

  <footer class="site-footer">
    <p class="footer-mark" aria-hidden="true">✦</p>
    <p data-i18n="footer">The Digital Museum — every image holds a story.</p>
  </footer>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-panel">
      <button class="modal-close" id="modalClose" type="button" data-i18n="close" aria-label="Close">Close</button>
      <img class="modal-img" id="modalImg" src="" alt="" />
      <div class="modal-body">
        <p class="modal-cat" id="modalCat"></p>
        <h2 class="modal-title" id="modalTitle"></h2>
        <p class="modal-story" id="modalStory"></p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
